integralfamilies:
  - name: "lbl3madj"
    loop_momenta: [l, k1, k2]
    top_level_sectors: [1023]
    propagators:
      - [ "(l + p1)^2 - 1", 0 ]
      - [ "(l - k1 + p1)^2 - 1", 0 ]
      - [ "(l - k1 - k2 + p1)^2 - 1", 0 ]
      - [ "(l - k2 + p1)^2 - 1", 0 ]
      - [ "(l - k2 + p1 + p2)^2 - 1", 0 ]
      - [ "(l + p1 + p2)^2 - 1", 0 ]
      - [ "(l + p1 + p2 + p3)^2 - 1", 0 ]
      - [ "l^2 - 1", 0 ]
      - [ "k1^2", 0 ]
      - [ "k2^2", 0 ]
      - [ "(k1 + p1)^2", 0 ]
      - [ "(k1 + p2)^2", 0 ]
      - [ "(k1 + p3)^2", 0 ]
      - [ "(k2 + p1)^2", 0 ]
      - [ "(k2 + p3)^2", 0 ]
    cut_propagators: []
