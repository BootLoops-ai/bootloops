kinematics:
  incoming_momenta: [p1, p2, p3, lbl3madjAuxLeg]
  outgoing_momenta: []
  momentum_conservation: [lbl3madjAuxLeg, -(p1 + p2 + p3)]
  kinematic_invariants:
  scalarproduct_rules:
    - [[p1,p1], 0]
    - [[p1,p2], (-1)/(2)]
    - [[p1,p3], (2)/(3)]
    - [[p2,p2], 0]
    - [[p2,p3], (-1)/(6)]
    - [[p3,p3], 0]
