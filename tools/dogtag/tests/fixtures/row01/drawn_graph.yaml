# Drawn graph of row 1, transcribed from figures/fig-dbox-outermass.tex and its caption
# (sections/results/outer-dbox.tex): six perimeter lines massM1 (red, common mass m,
# msq = m^2), central rung a2-b2 massless, legs p2@a1 p1@b1 p3@a3 p4@b3 all massless
# on-shell (style ext), all incoming, p4 = -p1-p2-p3; s=(p1+p2)^2, t=(p2+p3)^2.
# Propagator momenta derived by spanning-tree routing in the census script.
# figure source fig-dbox-outermass.tex sha16 92f25d6f4c75e067
# edge list: a1-a2[msq]; a2-a3[msq]; b1-b2[msq]; b2-b3[msq]; a1-b1[msq]; a3-b3[msq]; a2-b2[0]
# legs: p2@a1, p1@b1, p3@a3, p4@b3
integralfamilies:
  - name: "drawn_row01"
    loop_momenta: [k1, k2]
    propagators:
      - [ "k1 + k2 + p1 + p2 + p4", msq ]
      - [ "k1 - p3", msq ]
      - [ "-k1 - k2 + p1 + p2 + p3", msq ]
      - [ "-k1 + p1 + p2 + p3", msq ]
      - [ "-k1 - k2 + p2 + p3", msq ]
      - [ "k1", msq ]
      - [ "k2", 0 ]
    top_level_sectors: [127]
    # census labels (not read by the checker; read by the census script):
    external_momenta: [p1, p2, p3, p4]
    momentum_conservation: {p4: "-p1 - p2 - p3"}
    leg_virtualities: {p1: "0", p2: "0", p3: "0", p4: "0"}
