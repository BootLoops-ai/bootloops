# routing (loop momenta on the non-tree edges, tree edges by conservation; p in, p out):
#   L-T  style massM1  m^2 1  momentum k1
#   T-R  style massless  m^2 0  momentum k2
#   L-B  style massless  m^2 0  momentum -k1 + p
#   B-R  style massM1  m^2 1  momentum -k2 + p
#   T-B  style massM1  m^2 1  momentum k1 - k2
integralfamilies:
  - name: "drawn"
    loop_momenta: [k1, k2]
    top_level_sectors: [31]
    propagators:
      - [ "(k1)^2 - 1", 0 ]
      - [ "(k2)^2", 0 ]
      - [ "(-k1 + p)^2", 0 ]
      - [ "(-k2 + p)^2 - 1", 0 ]
      - [ "(k1 - k2)^2 - 1", 0 ]
    cut_propagators: []
