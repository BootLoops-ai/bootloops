# DRAWN GRAPH row 15 from figures/fig-icc.tex (edge<->propagator dictionary in its header), its caption in results/ice-cream-cones.tex, Table 2 row 15 and gallery tile 15.
# lines: Vb-V1 l2 (m1), Vb-V2 P56-l2 (m2), V1-V2 l1 (m3), V1-V2 P12-P56+l2-l1 (m4); row reading all m^2 = 1.
# leg dictionary: {"p1": "P56 at the apex Vb (cone sides m1,m2 meet)", "p2": "P34 at V1 (m1 side meets the scoop)", "p3": "-P12 at V2 (m2 side meets the scoop)", "arrows": "in-in-out"}
# leg labels (identity): {"p1": "off", "p2": "off", "p3": "off"}
# leg virtualities (kinematics): {"p1": "p56^2 = -1", "p2": "p34^2 = x", "p3": "p12^2 = x"}
# convention: all legs incoming, p_N = -(p_1 + ... + p_{N-1}); masses as m^2 in the mass field
integralfamilies:
  - name: "icc_drawn_eqmass"
    loop_momenta: [l1, l2]
    top_level_sectors: [15]
    propagators:
      - [ "(l2)^2", 1 ]
      - [ "(-l2 + p1)^2", 1 ]
      - [ "(l1)^2", 1 ]
      - [ "(-l1 + l2 + p2)^2", 1 ]
    cut_propagators: []
