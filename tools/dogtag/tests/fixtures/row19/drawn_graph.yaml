# DRAWN GRAPH, read off fig-banana-k3.tex (sha256 first 16 hex 3571171fa0f187c1) with the caption/label sources ['gallery-30.tex', 'results.tex', 'fdiag-style.tex'].
# Four thick red arcs (massM1 = m1 = 1 in fdiag-style.tex) between the two vertex dots, the top and bottom arcs labelled m; one external momentum p enters at L and leaves at R (single scale t = p^2/m^2, caption of fig:k3-banana: four equal-mass m^2 = 1 propagators). Table 2: 'Three-loop equal-mass banana'.
# Vertices ['L', 'R']; internal lines (u--v, mass^2): line1=L--R m2=1; line2=L--R m2=1; line3=L--R m2=1; line4=L--R m2=1
# External legs (all incoming; last = -(sum of the others)): p at L p^2=pp; pout at R p^2=pp
# Routing by momentum conservation: spanning tree ['line1'], chords ['line2', 'line3', 'line4'] carry ['k1', 'k2', 'k3'].
# Line -> propagator: line1: -k1 - k2 - k3 + p (m2=1); line2: k1 (m2=1); line3: k2 (m2=1); line4: k3 (m2=1)
integralfamilies:
  - name: "drawn_banana3L_eqmass"
    loop_momenta: [k1, k2, k3]
    top_level_sectors: [15]
    propagators:
      - ["-k1 - k2 - k3 + p", 1]
      - ["k1", 1]
      - ["k2", 1]
      - ["k3", 1]
