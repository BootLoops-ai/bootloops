# DRAWN GRAPH, read off fig-banana-4l-11116.tex (sha256 first 16 hex 4d61b039caba9a19) with the caption/label sources ['gallery-30.tex', 'results.tex', 'fdiag-style.tex'].
# Four thick red arcs labelled m (massM1 = m1 = 1) and one thick blue straight middle line whose tile text reads 4m (header: 'heavy line of mass 4m (BLUE, massM2), tuned to the coalescence sqrt(16) = 1+1+1+1'); the shared palette assigns blue to m2 = sqrt 2, so the tile's text label and the Table 2 tuple (1,1,1,1,16) override it: squared masses (1,1,1,1,16). One external momentum p through.
