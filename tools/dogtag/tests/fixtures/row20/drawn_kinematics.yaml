# kinematics of the drawn graph (legs all incoming; virtualities as drawn/captioned)
kinematics:
  incoming_momenta: [p1, p2, p3, p4]
  outgoing_momenta: []
  momentum_conservation: [p4, -p1-p2-p3]
  scalarproduct_rules:
    - [[p1, p1], "0"]
    - [[p2, p2], "0"]
    - [[p3, p3], "0"]
    - [[p1, p2], "s/2"]
    - [[p1, p3], "t/2"]
    - [[p2, p3], "(M-s-t)/2"]
