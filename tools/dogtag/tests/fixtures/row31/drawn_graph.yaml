# DRAWN GRAPH, read off fig-banana-1119.tex (sha256 first 16 hex fa1189ce3db92d25) with the caption/label sources ['gallery-30.tex', 'results.tex', 'fdiag-style.tex'].
# Three thick red arcs labelled m (massM1 = m1 = 1) and one thick blue arc whose tile text reads 3m (the figure header: 'one heavy line of mass 3m ... sqrt(M4) = 3m'); the shared palette in fdiag-style.tex assigns blue (massM2) to m2 = sqrt 2, so the tile's text label, the Table 2 tuple (1,1,1,9) and the header override the palette here: squared masses (1,1,1,9). One external momentum p through (t = p^2).
# Vertices ['L', 'R']; internal lines (u--v, mass^2): line1=L--R m2=1; line2=L--R m2=1; line3=L--R m2=1; line4=L--R m2=9
# External legs (all incoming; last = -(sum of the others)): p at L p^2=pp; pout at R p^2=pp
# Routing by momentum conservation: spanning tree ['line1'], chords ['line2', 'line3', 'line4'] carry ['k1', 'k2', 'k3'].
# Line -> propagator: line1: -k1 - k2 - k3 + p (m2=1); line2: k1 (m2=1); line3: k2 (m2=1); line4: k3 (m2=9)
integralfamilies:
  - name: "drawn_banana3L_1119"
    loop_momenta: [k1, k2, k3]
    top_level_sectors: [15]
    propagators:
      - ["-k1 - k2 - k3 + p", 1]
      - ["k1", 1]
      - ["k2", 1]
      - ["k3", 9]
