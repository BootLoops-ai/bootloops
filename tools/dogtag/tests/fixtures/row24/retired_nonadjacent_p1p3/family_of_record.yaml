integralfamilies:
  - name: "hexabox"
    loop_momenta: [k1, k2]
    top_level_sectors: [255]
    propagators:
      - [ "k1^2", 0 ]
      - [ "k2^2", 0 ]
      - [ "(k1 - k2 + p4)^2", 0 ]
      - [ "(k2 - p4)^2", 0 ]
      - [ "(k1 + p1 + p2 + p3 + p4)^2", 0 ]
      - [ "(k1 - k2 + p1 + p2 + p3 + p4)^2", 0 ]
      - [ "(k1 - k2 + p2 + p3 + p4)^2", 0 ]
      - [ "(k1 - k2 + p3 + p4)^2", 0 ]
      - [ "(k1 + p1)^2", 0 ]
      - [ "(k2 + p2)^2", 0 ]
      - [ "(k2 + p3)^2", 0 ]
    cut_propagators: []
