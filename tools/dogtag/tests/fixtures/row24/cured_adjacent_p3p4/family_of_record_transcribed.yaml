# transcription (script-emitted) of the family block of pB40.json (sha16 de08e62a6b7edf47) for the CLI run; five legs, p5 = -(p1+p2+p3+p4) implicit
# p1^2=p2^2=0, p3^2=p4^2=mm (adjacent), p5^2 computed from the replacement rules
integralfamilies:
  - name: "hexaboxP3P4"
    loop_momenta: [k1, k2]
    top_level_sectors: [255]
    propagators:
      - [ "k1^2", 0 ]
      - [ "k2^2", 0 ]
      - [ "(k1 - k2 + p4)^2", 0 ]
      - [ "(k2 - p4)^2", 0 ]
      - [ "(k1 + p1 + p2 + p3 + p4)^2", 0 ]
      - [ "(k1 - k2 + p1 + p2 + p3 + p4)^2", 0 ]
      - [ "(k1 - k2 + p2 + p3 + p4)^2", 0 ]
      - [ "(k1 - k2 + p3 + p4)^2", 0 ]
      - [ "(k1 + p1)^2", 0 ]
      - [ "(k2 + p2)^2", 0 ]
      - [ "(k2 + p3)^2", 0 ]
    cut_propagators: []
