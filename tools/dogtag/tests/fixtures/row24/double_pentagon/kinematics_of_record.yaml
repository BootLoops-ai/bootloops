kinematics:
  incoming_momenta: [p1, p2, p3, p4]
  outgoing_momenta: []
  momentum_conservation: [p5, -p1-p2-p3-p4]
  kinematic_invariants:
    - [s12, 2]
    - [s23, 2]
    - [s34, 2]
    - [s45, 2]
    - [s15, 2]
    - [mm3, 2]
    - [mm4, 2]
  scalarproduct_rules:
    - [[p1, p1], 0]
    - [[p2, p2], 0]
    - [[p3, p3], "mm3"]
    - [[p4, p4], "mm4"]
    - [[p1, p2], "s12/2"]
    - [[p1, p3], "(-s12-s23+s45)/2"]
    - [[p1, p4], "(-s15+s23-s45)/2"]
    - [[p2, p3], "(-mm3+s23)/2"]
    - [[p2, p4], "(mm3+s15-s23-s34)/2"]
    - [[p3, p4], "(-mm3-mm4+s34)/2"]
