# 3-loop QED LbL kinematics: 4 on-shell massless photons, p1+p2+p3+p4=0.
# s=(p1+p2)^2, t=(p2+p3)^2, u=(p1+p3)^2=-s-t. Single internal mass m2.
kinematics:
  incoming_momenta: [p1, p2, p3, p4]
  outgoing_momenta: []
  momentum_conservation: [p4, -p1-p2-p3]
  kinematic_invariants:
    - [s, 2]
    - [t, 2]
    - [m2, 2]
  scalarproduct_rules:
    - [[p1, p1], 0]
    - [[p2, p2], 0]
    - [[p3, p3], 0]
    - [[p1, p2], s/2]
    - [[p2, p3], t/2]
    - [[p1, p3], (-s-t)/2]
  symbol_to_replace_by_one: m2
