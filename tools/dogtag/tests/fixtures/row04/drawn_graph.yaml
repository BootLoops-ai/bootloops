# Drawn graph of row 4, transcribed from figures/fig-c5-ladder.tex and its caption
# (sections/results/c5-ladder.tex): three boxes sharing rails, ten massless lines, legs
# p1@a1 (top-left) p2@b1 (bottom-left) p3@b4 (bottom-right) p4@a4 (top-right), all
# massless on-shell, all incoming, p4 = -p1-p2-p3; s=(p1+p2)^2, t=(p2+p3)^2.
# Propagator momenta derived by spanning-tree routing in the census script.
# figure source fig-c5-ladder.tex sha16 81292e2347a70a59
# edge list: a1-a2[0]; a2-a3[0]; a3-a4[0]; b1-b2[0]; b2-b3[0]; b3-b4[0]; a1-b1[0]; a2-b2[0]; a3-b3[0]; a4-b4[0]
# legs: p1@a1, p2@b1, p3@b4, p4@a4
integralfamilies:
  - name: "drawn_row04"
    loop_momenta: [k1, k2, k3]
    propagators:
      - [ "k1 + k2 + k3 - p4", 0 ]
      - [ "k2 + k3 + p1 + p2 + p3", 0 ]
      - [ "k3 + p1 + p2 + p3", 0 ]
      - [ "-k1 - k2 - k3 - p3", 0 ]
      - [ "-k2 - k3 - p3", 0 ]
      - [ "-k3 - p3", 0 ]
      - [ "-k1 - k2 - k3 - p2 - p3", 0 ]
      - [ "k1", 0 ]
      - [ "k2", 0 ]
      - [ "k3", 0 ]
    top_level_sectors: [1023]
    # census labels (not read by the checker; read by the census script):
    external_momenta: [p1, p2, p3, p4]
    momentum_conservation: {p4: "-p1 - p2 - p3"}
    leg_virtualities: {p1: "0", p2: "0", p3: "0", p4: "0"}
