kinematics:
  incoming_momenta: [p1, p2, p3, p4]
  outgoing_momenta: []
  momentum_conservation: [p4, "-p1-p2-p3"]
  kinematic_invariants:
    - [s, 2]      # s = (p1+p2)^2
    - [t, 2]      # t = (p1+p3)^2
    - [msq, 2]    # m^2 (electron mass squared)
  scalarproduct_rules:
    # all external photons on-shell massless
    - [ "p1*p1", 0 ]
    - [ "p2*p2", 0 ]
    - [ "p3*p3", 0 ]
    - [ "p1*p2", "s/2" ]
    - [ "p1*p3", "t/2" ]
    - [ "p2*p3", "(-s-t)/2" ]   # u = -s-t since sum p_i=0, all massless
  symbol_to_replace_by_one: msq
