# ALL-INCOMING convention, verbatim arXiv:2409.08879:
# s=(p1+p2)^2, t=(p2+p3)^2, u=(p1+p3)^2, s+t+u=2 mW2, p4=-(p1+p2+p3)
kinematics:
  incoming_momenta: [p1, p2, p3, p4]
  outgoing_momenta: []
  momentum_conservation: [p4, "-p1 - p2 - p3"]
  kinematic_invariants:
    - [s, 2]
    - [t, 2]
    - [mW2, 2]
  scalarproduct_rules:
    - [[p1, p1], 0]
    - [[p2, p2], 0]
    - [[p3, p3], mW2]
    - [[p1, p2], "s/2"]
    - [[p2, p3], "(t - mW2)/2"]
    - [[p1, p3], "(mW2 - s - t)/2"]
