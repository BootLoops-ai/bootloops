[project]
name = "seedling-ibp"
version = "1.0.0"
description = "Adaptive certified seeding wrapper for Kira IBP reduction"
license = "MIT"
authors = [{name = "Matthew D. Schwartz"}]
requires-python = ">=3.10"
dependencies = ["pyyaml", "sympy"]

[project.scripts]
seedling = "seedling.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
